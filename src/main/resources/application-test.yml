#github actions용 테스트 설정

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/jupjup_ticket_server_test
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true # ddl-auto로 테이블이 모두 생성된 후 data.sql이 실행되도록 보장

  sql:
    init:
      mode: always